# --- Social sources（与 companies 并列；由 tide_watch.sources.social 加载） ---
social_sources:
  - source_id: reddit_local_llm
    platform: reddit
    source_type: subreddit_feed
    handle_or_community: LocalLLaMA
    enabled: false
    priority: 100
    include_comments: true
    max_items: 15
    metadata_fallback: true
    trust_tier: 2

  - source_id: hackernews_ai
    platform: hackernews
    source_type: search
    query: ai OR llm
    enabled: false
    priority: 90
    max_items: 15
    metadata_fallback: true
    trust_tier: 2

  - source_id: hackernews_top
    platform: hackernews
    source_type: top_feed
    enabled: false
    priority: 85
    max_items: 12
    metadata_fallback: true
    trust_tier: 2

  - source_id: x_openai
    platform: x
    source_type: account_feed
    handle_or_community: OpenAI
    enabled: false
    priority: 80
    metadata_fallback: true
    trust_tier: 2

# --- Search providers / monitors（由 tide_watch.sources.search 加载） ---
search_providers:
  - provider_id: newsapi_main
    provider: newsapi
    enabled: true
    api_key_ref: NEWSAPI_API_KEY
    default_limit: 20
    timeout_sec: 20

  - provider_id: brave_main
    provider: brave
    enabled: true
    api_key_ref: BRAVE_SEARCH_API_KEY
    default_limit: 10
    timeout_sec: 20

  - provider_id: tavily_main
    provider: tavily
    enabled: false
    api_key_ref: TAVILY_API_KEY
    default_limit: 10
    timeout_sec: 20

  - provider_id: exa_main
    provider: exa
    enabled: false
    api_key_ref: EXA_API_KEY
    default_limit: 10

  - provider_id: google_cse_main
    provider: google_cse
    enabled: false
    api_key_ref: GOOGLE_CSE_API_KEY
    default_limit: 10

search_monitors:
  - monitor_id: openai_brand
    topic: OpenAI
    query_templates: [brand_updates, brand_risk, product_updates]
    enabled: true
    providers: [newsapi_main, brave_main]
    time_window: 7d
    language: en
    priority: 90
    products: [ChatGPT, GPT-4.1, API]
    risk_terms: [outage, lawsuit, safety, incident, policy]

  - monitor_id: claude_code
    topic: Claude Code
    query_templates: [product_updates, product_feedback, industry_trend]
    enabled: false
    providers: [brave_main, tavily_main]
    time_window: 7d
    language: en
    priority: 80
    competitors: [ChatGPT, Gemini]
